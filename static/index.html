<!DOCTYPE html>
<html>

<head>
    <title>Churn Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h2>Customer Churn Predictor</h2>
    <form id="churnForm">
        <label>Tenure (months)</label>
        <input type="number" id="tenure" value="12" required>

        <label>Monthly Charges</label>
        <input type="number" step="0.01" id="MonthlyCharges" value="70.35" required>

        <label>Total Charges</label>
        <input type="number" step="0.01" id="TotalCharges" value="845.5" required>

        <label>Contract</label>
        <select id="Contract">
            <option>Month-to-month</option>
            <option>One year</option>
            <option>Two year</option>
        </select>

        <label>Internet Service</label>
        <select id="InternetService">
            <option>DSL</option>
            <option>Fiber optic</option>
            <option>No</option>
        </select>

        <button type="submit">Predict Churn</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('churnForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                gender: "Female", SeniorCitizen: 0, Partner: "Yes", Dependents: "No",
                tenure: parseInt(document.getElementById('tenure').value),
                PhoneService: "Yes", MultipleLines: "No",
                InternetService: document.getElementById('InternetService').value,
                OnlineSecurity: "No", OnlineBackup: "Yes", DeviceProtection: "No",
                TechSupport: "No", StreamingTV: "No", StreamingMovies: "No",
                Contract: document.getElementById('Contract').value,
                PaperlessBilling: "Yes", PaymentMethod: "Electronic check",
                MonthlyCharges: parseFloat(document.getElementById('MonthlyCharges').value),
                TotalCharges: parseFloat(document.getElementById('TotalCharges').value)
            };

            const res = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            const resultDiv = document.getElementById('result');
            resultDiv.style.background = data.churn_prediction === "Yes" ? "#fee2e2" : "#dcfce7";
            resultDiv.innerText = `Prediction: ${data.churn_prediction} (probability: ${(data.churn_probability * 100).toFixed(1)}%)`;
        });
    </script>
</body>

</html>
